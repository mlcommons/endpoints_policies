name: "Mirror seed sets to the CLI"

# When seedset.yaml changes on main, open a PR in endpoints-submission-cli that
# copies it into src/submission_checker/data/seed_sets.yaml. The checker reads only
# its bundled copy, so a new set is rejected until that PR merges and ships.
on:
  push:
    branches: [main]
    paths: [seedset.yaml]
  workflow_dispatch:

concurrency:
  group: mirror-seed-sets
  cancel-in-progress: false

permissions:
  contents: read # check out this repo
  pull-requests: read # find the PR behind the merge commit

jobs:
  mirror:
    runs-on: ubuntu-latest
    # Holds the endpoints automation app's secrets; limited to main.
    environment: AI workflow
    steps:
      - name: Mint app token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ENDPOINTS_AUTOMATION_BOT_CLIENT_ID }}
          private-key: ${{ secrets.ENDPOINTS_AUTOMATION_APP_PVT_KEY }}
          owner: mlcommons
          repositories: endpoints-submission-cli
          permission-contents: write # push the mirror branch
          permission-pull-requests: write # open the PR

      - name: Checkout policies
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: policies

      - name: Checkout CLI
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: mlcommons/endpoints-submission-cli
          token: ${{ steps.app.outputs.token }}
          path: cli

      - name: Write the CLI copy
        id: write
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          src=policies/seedset.yaml
          dst=cli/src/submission_checker/data/seed_sets.yaml
          cohort=$(sed -n 's/^ *cohort-id: *\([0-9]\{4\}-[0-9]\{2\}-C[01]\).*/\1/p' "$src")
          [ -n "$cohort" ] || { echo "::error::no cohort-id in $src"; exit 1; }
          grep -q '^cohort:' "$src" || { echo "::error::no 'cohort:' block in $src"; exit 1; }
          sha=$(git -C policies rev-parse HEAD)
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" --jq '.[0].number // empty')
          # Compare only the data; the CLI's header differs on purpose.
          if diff -q <(sed -n '/^cohort:/,$p' "$src") <(sed -n '/^cohort:/,$p' "$dst") >/dev/null; then
            echo "CLI copy already matches; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "# MLPerf Endpoints published seed sets (§4.6 Seed Rotation)."
            echo "#"
            echo "# Copied from \`mlcommons/endpoints_policies\` \`seedset.yaml\` at ${sha:0:7}${pr:+ (PR #$pr)}"
            echo "# by that repo's mirror-seed-sets workflow. Everything below this header is"
            echo "# unchanged from the source; edit seedset.yaml there, not this file."
            echo "#"
            echo "# Each set lists its own \`cohorts:\` window. A set without one is given the"
            echo "# window of the file-level \`cohort-id\`, which would re-date older sets."
            echo "#"
            echo "# Override with \$MLPERF_ENDPOINTS_SEED_SETS to use a newer file without a release."
            echo
            sed -n '/^cohort:/,$p' "$src"
          } > "$dst"
          {
            echo "changed=true"
            echo "cohort=$cohort"
            echo "sha=$sha"
            echo "pr=$pr"
          } >> "$GITHUB_OUTPUT"

      - name: Open the CLI PR
        if: steps.write.outputs.changed == 'true'
        working-directory: cli
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          COHORT: ${{ steps.write.outputs.cohort }}
          SHA: ${{ steps.write.outputs.sha }}
          PR: ${{ steps.write.outputs.pr }}
        run: |
          set -euo pipefail
          branch="seed-sets/${COHORT}"
          source="mlcommons/endpoints_policies@${SHA:0:7}${PR:+ (mlcommons/endpoints_policies#$PR)}"
          bot_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/submission_checker/data/seed_sets.yaml
          git commit -m "Mirror seed sets for cohort ${COHORT}" -m "Copied from ${source}."
          # Replace a branch left by an earlier run, the same way the rotation job does.
          stale=$(git ls-remote --heads origin "refs/heads/${branch}" | cut -f1)
          git push --force-with-lease="refs/heads/${branch}:${stale}" --set-upstream origin "$branch"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')" ]; then
            echo "A PR for ${branch} is already open; its branch was updated."
            exit 0
          fi
          gh pr create --base main --head "$branch" \
            --title "Mirror seed sets for cohort ${COHORT}" \
            --body-file - <<EOF
          Copies \`seedset.yaml\` from ${source} into \`src/submission_checker/data/seed_sets.yaml\`.

          Before merging, check in the diff that no existing set's seeds or \`cohorts:\` window changed or was removed.

          After merging, release the CLI. Until then the checker rejects submissions that use the new set.
          EOF
